<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <radialGradient id="emerald-glow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyan-glow" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="card-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <!-- Filters -->
    <filter id="shadow-lg" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="shadow-md" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; }
    .font-mono { font-family: "Cascadia Code", "Consolas", "Courier New", monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1280" height="520" fill="url(#bg-gradient)" />
  <rect width="1280" height="520" fill="url(#emerald-glow)" />
  <rect width="1280" height="520" fill="url(#cyan-glow)" />
  <rect width="1280" height="520" fill="url(#dot-grid)" />

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1278" height="518" rx="8" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- LEFT SECTION: Branding, Architecture & Core Value -->
  <g transform="translate(64, 52)">
    <!-- Top Category Tag -->
    <g transform="translate(0, 0)">
      <rect width="216" height="28" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#10B981" />
      <text x="26" y="18" fill="#94A3B8" class="font-mono" font-size="11" font-weight="600" letter-spacing="1">WINDOWS UTILITY / NET 8</text>
    </g>

    <!-- Project Brand Header (Logo + Wordmark) -->
    <g transform="translate(0, 44)">
      <!-- Geometric Bird Emblem -->
      <g fill="url(#brand-grad)" transform="translate(0, -6) scale(0.62)">
        <path d="M22 10 L25 58 L50 83 L71 60 Z"/>
        <path d="M96 40 L76 61 L97 82 Z"/>
        <path d="M100 42 L100 57 L114 57 Z"/>
        <path d="M95 86 L74 64 L51 86 Z"/>
        <path d="M15 89 L34 108 L53 90 Z"/>
        <path d="M95 89 L57 89 L57 127 Z"/>
      </g>

      <!-- Wordmark -->
      <text x="84" y="54" fill="#F8FAFC" class="font-sans" font-size="46" font-weight="800" letter-spacing="2">ZSNΛPΞR</text>
      <rect x="84" y="68" width="56" height="3" rx="1.5" fill="url(#accent-bar)" />
    </g>

    <!-- Primary Enterprise Description -->
    <text x="0" y="152" fill="#F1F5F9" class="font-sans" font-size="20" font-weight="600" letter-spacing="0.5">
      轻量高效的 Windows 桌面截图与本地 OCR 识别套件
    </text>
    <text x="0" y="178" fill="#94A3B8" class="font-sans" font-size="13.5" font-weight="400" letter-spacing="0.2">
      基于 .NET 8 与 Windows.Media.Ocr 原生离线引擎，毫秒级捕获，数据 100% 本地安全。
    </text>

    <!-- Key Technical Pillar Badges -->
    <g transform="translate(0, 214)">
      <!-- Item 1: Native OCR -->
      <g transform="translate(0, 0)">
        <rect width="240" height="42" rx="8" fill="#0F172A" fill-opacity="0.8" stroke="#1E293B" stroke-width="1" />
        <rect x="0" y="0" width="4" height="42" rx="2" fill="#10B981" />
        <text x="16" y="20" fill="#E2E8F0" class="font-sans" font-size="12" font-weight="600">原生离线 OCR 引擎</text>
        <text x="16" y="34" fill="#64748B" class="font-sans" font-size="10.5">无网络请求 / 隐私零泄露</text>
      </g>

      <!-- Item 2: Skia Hardware Acceleration -->
      <g transform="translate(254, 0)">
        <rect width="240" height="42" rx="8" fill="#0F172A" fill-opacity="0.8" stroke="#1E293B" stroke-width="1" />
        <rect x="0" y="0" width="4" height="42" rx="2" fill="#06B6D4" />
        <text x="16" y="20" fill="#E2E8F0" class="font-sans" font-size="12" font-weight="600">SkiaSharp 硬件加速</text>
        <text x="16" y="34" fill="#64748B" class="font-sans" font-size="10.5">高刷新光栅层 / 丝滑批注</text>
      </g>

      <!-- Item 3: Smart Selection & Virtual Screen -->
      <g transform="translate(0, 52)">
        <rect width="240" height="42" rx="8" fill="#0F172A" fill-opacity="0.8" stroke="#1E293B" stroke-width="1" />
        <rect x="0" y="0" width="4" height="42" rx="2" fill="#3B82F6" />
        <text x="16" y="20" fill="#E2E8F0" class="font-sans" font-size="12" font-weight="600">智能窗口元素探测</text>
        <text x="16" y="34" fill="#64748B" class="font-sans" font-size="10.5">跨显示器虚拟坐标系支持</text>
      </g>

      <!-- Item 4: Per-Monitor V2 High DPI -->
      <g transform="translate(254, 52)">
        <rect width="240" height="42" rx="8" fill="#0F172A" fill-opacity="0.8" stroke="#1E293B" stroke-width="1" />
        <rect x="0" y="0" width="4" height="42" rx="2" fill="#8B5CF6" />
        <text x="16" y="20" fill="#E2E8F0" class="font-sans" font-size="12" font-weight="600">Per-Monitor V2 高分屏</text>
        <text x="16" y="34" fill="#64748B" class="font-sans" font-size="10.5">多倍率混合缩放无损呈现</text>
      </g>
    </g>

    <!-- Technical Spec Tags Footer -->
    <g transform="translate(0, 334)">
      <rect x="0" y="0" width="102" height="24" rx="4" fill="#1E293B" />
      <text x="8" y="16" fill="#94A3B8" class="font-mono" font-size="10.5">C# 12 / .NET 8</text>

      <rect x="112" y="0" width="118" height="24" rx="4" fill="#1E293B" />
      <text x="120" y="16" fill="#94A3B8" class="font-mono" font-size="10.5">Win10 (1809+) / 11</text>

      <rect x="240" y="0" width="94" height="24" rx="4" fill="#1E293B" />
      <text x="248" y="16" fill="#94A3B8" class="font-mono" font-size="10.5">MIT License</text>

      <rect x="344" y="0" width="128" height="24" rx="4" fill="#064E3B" stroke="#059669" stroke-width="0.8" />
      <text x="352" y="16" fill="#34D399" class="font-mono" font-size="10.5" font-weight="600">Zero Telemetry</text>
    </g>
  </g>

  <!-- RIGHT SECTION: Modern Desktop UI Showcase Mockup -->
  <g transform="translate(620, 44)" filter="url(#shadow-lg)">
    <!-- Base Desktop Window / Viewport Mockup -->
    <rect width="600" height="428" rx="12" fill="url(#card-glass)" stroke="url(#card-border)" stroke-width="1.5" />

    <!-- Window Titlebar -->
    <rect width="600" height="38" rx="12" fill="#0B1320" fill-opacity="0.9" />
    <path d="M0 38 L600 38" stroke="#1E293B" stroke-width="1" />
    
    <!-- Titlebar Window Controls -->
    <circle cx="22" cy="19" r="5" fill="#EF4444" fill-opacity="0.8" />
    <circle cx="38" cy="19" r="5" fill="#F59E0B" fill-opacity="0.8" />
    <circle cx="54" cy="19" r="5" fill="#10B981" fill-opacity="0.8" />
    <text x="76" y="23" fill="#64748B" class="font-mono" font-size="11">ZSnaper Runtime Environment · Display #1 [3840×2160 @ 150%]</text>

    <!-- Simulated Desktop Grid / Content Background -->
    <g transform="translate(20, 56)">
      <!-- Precision Screen Capture Bounding Box Area -->
      <rect x="18" y="12" width="370" height="236" rx="6" fill="#020617" fill-opacity="0.6" stroke="#10B981" stroke-width="1.8" stroke-dasharray="6 3" />
      
      <!-- Coordinate / Dimension Label -->
      <g transform="translate(24, 18)">
        <rect width="116" height="22" rx="4" fill="#10B981" />
        <text x="8" y="15" fill="#022C22" class="font-mono" font-size="11" font-weight="700">1920 × 1080 px</text>
      </g>

      <!-- Corner Anchor Handles -->
      <rect x="14" y="8" width="8" height="8" rx="1" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
      <rect x="384" y="8" width="8" height="8" rx="1" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
      <rect x="14" y="244" width="8" height="8" rx="1" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
      <rect x="384" y="244" width="8" height="8" rx="1" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />

      <!-- Sample Visual Annotations Inside Capture Box -->
      <!-- Vector Arrow -->
      <path d="M 60 160 Q 110 110 170 120" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
      <polygon points="176,121 164,113 167,126" fill="#EF4444" />
      
      <!-- Text Annotation -->
      <rect x="184" y="106" width="132" height="26" rx="4" fill="#0F172A" stroke="#EF4444" stroke-width="1" />
      <text x="192" y="123" fill="#FCA5A5" class="font-sans" font-size="11" font-weight="600">异常堆栈调用分析</text>

      <!-- Mosaic Area Preview -->
      <g transform="translate(60, 64)">
        <rect width="140" height="42" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <!-- Pixel blocks -->
        <rect x="4" y="4" width="16" height="16" fill="#475569" />
        <rect x="22" y="4" width="16" height="16" fill="#334155" />
        <rect x="40" y="4" width="16" height="16" fill="#64748B" />
        <rect x="58" y="4" width="16" height="16" fill="#1E293B" />
        <rect x="76" y="4" width="16" height="16" fill="#475569" />
        <rect x="94" y="4" width="16" height="16" fill="#334155" />
        <rect x="112" y="4" width="16" height="16" fill="#64748B" />
        <rect x="4" y="22" width="16" height="16" fill="#334155" />
        <rect x="22" y="22" width="16" height="16" fill="#64748B" />
        <rect x="40" y="22" width="16" height="16" fill="#1E293B" />
        <rect x="58" y="22" width="16" height="16" fill="#475569" />
        <rect x="76" y="22" width="16" height="16" fill="#334155" />
        <rect x="94" y="22" width="16" height="16" fill="#64748B" />
        <rect x="112" y="22" width="16" height="16" fill="#1E293B" />
      </g>

      <!-- Floating Capture Toolbar -->
      <g transform="translate(56, 260)" filter="url(#shadow-md)">
        <rect width="320" height="40" rx="8" fill="#0B132B" stroke="#334155" stroke-width="1.2" />
        
        <!-- Tool icons simulation -->
        <!-- Pen -->
        <g transform="translate(12, 10)">
          <rect width="20" height="20" rx="4" fill="#1E293B" />
          <path d="M5 15 L15 5 L17 7 L7 17 Z" fill="#94A3B8" />
        </g>
        <!-- Arrow -->
        <g transform="translate(42, 10)">
          <rect width="20" height="20" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="0.8" />
          <path d="M6 14 L14 6 M14 6 L9 6 M14 6 L14 11" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <!-- Text -->
        <g transform="translate(72, 10)">
          <rect width="20" height="20" rx="4" fill="#1E293B" />
          <text x="6" y="15" fill="#94A3B8" class="font-sans" font-size="12" font-weight="700">T</text>
        </g>
        <!-- Mosaic -->
        <g transform="translate(102, 10)">
          <rect width="20" height="20" rx="4" fill="#1E293B" />
          <rect x="4" y="4" width="5" height="5" fill="#94A3B8" />
          <rect x="11" y="4" width="5" height="5" fill="#64748B" />
          <rect x="4" y="11" width="5" height="5" fill="#64748B" />
          <rect x="11" y="11" width="5" height="5" fill="#94A3B8" />
        </g>

        <!-- Divider -->
        <line x1="134" y1="8" x2="134" y2="32" stroke="#334155" stroke-width="1" />

        <!-- OCR Button (Highlighted) -->
        <g transform="translate(144, 8)">
          <rect width="52" height="24" rx="5" fill="#065F46" stroke="#10B981" stroke-width="1" />
          <text x="10" y="16" fill="#6EE7B7" class="font-mono" font-size="10.5" font-weight="700">OCR</text>
        </g>

        <!-- Copy Button -->
        <g transform="translate(204, 8)">
          <rect width="48" height="24" rx="5" fill="#1E293B" stroke="#475569" stroke-width="0.8" />
          <text x="11" y="16" fill="#CBD5E1" class="font-sans" font-size="10.5">复制</text>
        </g>

        <!-- Complete / Save Button -->
        <g transform="translate(258, 8)">
          <rect width="50" height="24" rx="5" fill="#10B981" />
          <text x="13" y="16" fill="#022C22" class="font-sans" font-size="10.5" font-weight="700">完成</text>
        </g>
      </g>
    </g>

    <!-- OCR Result Window Card (Layered Overlay on Right Side) -->
    <g transform="translate(340, 130)" filter="url(#shadow-lg)">
      <rect width="232" height="216" rx="10" fill="#0A111E" stroke="#334155" stroke-width="1.2" />
      
      <!-- OCR Window Header -->
      <rect width="232" height="30" rx="10" fill="#162032" />
      <circle cx="14" cy="15" r="3.5" fill="#10B981" />
      <text x="24" y="19" fill="#E2E8F0" class="font-sans" font-size="10.5" font-weight="600">OCR 识别结果 (离线)</text>
      <text x="176" y="19" fill="#64748B" class="font-mono" font-size="9.5">42 字符</text>

      <!-- OCR Content Text Lines -->
      <g transform="translate(14, 42)">
        <rect width="204" height="124" rx="6" fill="#060911" stroke="#1E293B" stroke-width="0.8" />
        <text x="10" y="20" fill="#38BDF8" class="font-mono" font-size="10">// Windows.Media.Ocr</text>
        <text x="10" y="38" fill="#E2E8F0" class="font-mono" font-size="10">public static async</text>
        <text x="10" y="56" fill="#A7F3D0" class="font-mono" font-size="10">Task&lt;string&gt; Recognize()</text>
        <text x="10" y="74" fill="#94A3B8" class="font-mono" font-size="10">{</text>
        <text x="22" y="92" fill="#F1F5F9" class="font-mono" font-size="10">return localText;</text>
        <text x="10" y="110" fill="#94A3B8" class="font-mono" font-size="10">}</text>
      </g>

      <!-- Action Footer -->
      <g transform="translate(14, 176)">
        <rect width="96" height="26" rx="4" fill="#10B981" />
        <text x="18" y="17" fill="#022C22" class="font-sans" font-size="10.5" font-weight="700">一键复制文本</text>

        <rect x="108" y="0" width="96" height="26" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
        <text x="126" y="17" fill="#CBD5E1" class="font-sans" font-size="10.5">整理段落</text>
      </g>
    </g>
  </g>
</svg>

