     width="2140"
     height="735"
     role="img"
     aria-labelledby="title desc">
  <title id="title">ZSnaper</title>
  <desc id="desc">ZSnaper white wordmark on pure black above a real-use capture scene with a translucent toolbar.</desc>

  <rect width="2140" height="735" fill="#000000"/>
